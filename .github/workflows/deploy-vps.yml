name: Deploy VPS

on:
  # Continuous deployment: every push to main that passes CI is deployed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual deploy of any branch / tag / SHA from the Actions tab.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or full SHA). Default: origin/main"
        required: false
        default: ""

# A deploy must never race another deploy/rollback.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Production VPS
    # Auto-deploy only when CI succeeded for a push (not for a PR build).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo Settings to gate deploys.
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL || 'https://lms.analyticsedify.com' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy commit
        id: ref
        env:
          # Passed via env (not ${{ }} in the script) so the input can't inject shell.
          REF_INPUT: ${{ inputs.ref }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REF="${CI_SHA:-${REF_INPUT:-origin/main}}"
          if ! printf '%s' "$REF" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Invalid ref (only alphanumeric, . _ / - allowed): $REF"
            exit 1
          fi
          SHA="$(git rev-parse --verify "${REF}^{commit}")"
          echo "Deploying ${REF} -> ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/lms_key
          chmod 600 ~/.ssh/lms_key
          ssh-keyscan -T 20 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          ssh -i ~/.ssh/lms_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_SHA='$DEPLOY_SHA' APP_URL='$APP_URL' bash -s" << 'EOF'
          set -euo pipefail

          cd "${{ secrets.VPS_PATH }}"
          CF="--env-file Backend/.env.production -f docker-compose.production.yml"

          echo "Fetching repo..."
          git fetch origin --prune
          if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$DEPLOY_SHA"
          fi

          echo "Pinning build to ${DEPLOY_SHA}"
          git checkout --detach "$DEPLOY_SHA"

          echo "Rebuilding Docker stack..."
          docker compose $CF build
          docker compose $CF up -d

          echo "Running database migrations..."
          docker compose $CF exec -T api1 npm run db:migrate:objectid-ids
          docker compose $CF exec -T api1 npm run db:migrate:admin-access-profiles
          docker compose $CF exec -T api1 npm run db:migrate:refresh-token-hashes
          docker compose $CF exec -T api1 npm run db:migrate:violations
          docker compose $CF exec -T api1 npm run db:create-indexes

          echo "Running production readiness check..."
          docker compose $CF exec -T api1 npm run prod:check

          echo "Waiting for ${APP_URL}/api/ready to come up healthy..."
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS "${APP_URL}/api/ready" > /dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::API did not become ready within 5 minutes after deploy"
            exit 1
          fi
          echo "API is ready."

          # Keep the disk from filling up with old image layers.
          docker image prune -f > /dev/null

          echo "Deployment completed successfully."
          EOF

      # Tags are pushed from the runner (GITHUB_TOKEN), so the VPS only needs
      # a read-only deploy key.
      - name: Tag release
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          RELEASE_TAG="release/$(date -u +%Y%m%dT%H%M%SZ)"
          git tag -f "$RELEASE_TAG" "$DEPLOY_SHA"
          git tag -f release/latest "$DEPLOY_SHA"
          git push origin "refs/tags/$RELEASE_TAG" "refs/tags/release/latest" --force
          echo "Tagged ${DEPLOY_SHA} as ${RELEASE_TAG}"
